[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "foxcam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opencv-python-headless", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
